<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Euforia</title>
<meta name="description" content="Portal del jugador de Euforia Ultimate">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Euforia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/euforia.css">
</head>
<body>

<!-- ═════════════ BIENVENIDA / LOGIN ═════════════ -->
<section id="auth">
  <div class="photo">
    <span class="logo" role="img" aria-label="Euforia"></span>
    <h1 class="auth-title">Portal del<br>jugador<em>Temporada 2026</em></h1>
  </div>
  <div class="auth-form">
    <div class="step on" id="st-codigo">
      <label class="field"><span class="cap">Número de camiseta</span>
        <input class="inp" id="inp-codigo" inputmode="text" autocomplete="username" placeholder="Ej: E10"></label>
      <button class="btn" id="b-codigo" onclick="checkCodigo()"><span class="sp"></span><span class="tx">Continuar</span></button>
      <div class="err" id="err-codigo"></div>
    </div>
    <div class="step" id="st-register">
      <div class="hello">Bienvenido, <span class="who"></span></div>
      <p class="hint">Es tu primera vez. Crea una contraseña de mínimo 6 caracteres.</p>
      <label class="field"><span class="cap">Nueva contraseña</span>
        <input class="inp" id="inp-reg-pass" type="password" autocomplete="new-password"></label>
      <label class="field"><span class="cap">Confirmar contraseña</span>
        <input class="inp" id="inp-reg-confirm" type="password" autocomplete="new-password"></label>
      <button class="btn" id="b-register" onclick="doRegister()"><span class="sp"></span><span class="tx">Crear cuenta</span></button>
      <button class="link" onclick="step('codigo')">← Cambiar número</button>
      <div class="err" id="err-register"></div>
    </div>
    <div class="step" id="st-login">
      <div class="hello">Hola, <span class="who"></span></div>
      <p class="hint">Ingresa tu contraseña.</p>
      <label class="field"><span class="cap">Contraseña</span>
        <input class="inp" id="inp-login-pass" type="password" autocomplete="current-password"></label>
      <button class="btn" id="b-login" onclick="doLogin()"><span class="sp"></span><span class="tx">Entrar</span></button>
      <button class="link" onclick="step('codigo')">← Cambiar número</button>
      <div class="err" id="err-login"></div>
    </div>
  </div>
</section>

<!-- ═════════════ APP ═════════════ -->
<div id="app">
  <header class="topbar">
    <span class="logo" role="img" aria-label="Euforia"></span>
    <button class="avatar" id="avatar" aria-label="Mi cuenta" onclick="go('mas')"></button>
  </header>

  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#c0272d"/></linearGradient>
  </defs></svg>

  <main>
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-mis"></section>
    <section class="view" id="v-equipo"></section>
    <section class="view" id="v-pagos"></section>
    <section class="view" id="v-mas"></section>
  </main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-v="inicio" onclick="go('inicio')"><svg class="i" data-i="home"></svg>Inicio</button>
    <button data-v="mis" onclick="go('mis')"><svg class="i" data-i="user"></svg>Mis stats</button>
    <button data-v="equipo" onclick="go('equipo')"><svg class="i" data-i="chart"></svg>Equipo</button>
    <button data-v="mas" onclick="go('mas')"><svg class="i" data-i="grid"></svg>Más</button>
  </nav>
</div>

<div class="sheet-bg" id="sh-pwd" onclick="if(event.target===this)closeSheet(this)">
  <div class="sheet">
    <div class="grab"></div>
    <h3>Cambiar contraseña</h3>
    <label class="field"><span class="cap">Contraseña actual</span><input class="inp" id="pwd-old" type="password" autocomplete="current-password"></label>
    <label class="field"><span class="cap">Nueva contraseña</span><input class="inp" id="pwd-new" type="password" autocomplete="new-password"></label>
    <label class="field"><span class="cap">Confirmar</span><input class="inp" id="pwd-confirm" type="password" autocomplete="new-password"></label>
    <button class="btn" id="b-pwd" onclick="doChangePwd()"><span class="sp"></span><span class="tx">Actualizar</span></button>
    <div class="err" id="err-pwd"></div>
  </div>
</div>

<div class="sheet-bg" id="sh-install" onclick="if(event.target===this)closeSheet(this)">
  <div class="sheet">
    <div class="grab"></div>
    <h3>Instala Euforia</h3>
    <ol id="install-steps"></ol>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/stats.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════
const API='https://script.google.com/macros/s/AKfycbwbV5XInsoGL7A_fWG767cGdltf7-h_do8VmYCkcDhU4xskeBKCQ4BkzsrVJGyv44IR/exec';
const LINKS={
  bienestar:'bienestar.html',
  subirEvidencias:'https://forms.gle/iZm4FDhRETrxR3Bt9',
  verEvidencias:'https://datastudio.google.com/reporting/6b0ac1e1-4c10-4cb8-8f1b-12181a9c68eb',
};
const VERSION='v5';
const HIST=['MUNDIAL'];   // categorías de temporadas pasadas: van al final como historial
const isHist=c=>HIST.includes(String(c).toUpperCase());
const DEMO=new URLSearchParams(location.search).has('demo');

const ICONS={
  home:'<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/>',
  wallet:'<rect x="2" y="5" width="20" height="15" rx="3"/><path d="M2 10h20"/><path d="M16 15h2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15v2"/><path d="M12 10v7"/><path d="M17 6v11"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8"/><path d="m16 7 3 3"/><path d="m18.5 4.5 2 2"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  install:'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
  alert:'<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
function paintIcons(root=document){root.querySelectorAll('svg[data-i]').forEach(s=>{s.setAttribute('viewBox','0 0 24 24');s.innerHTML=ICONS[s.dataset.i];s.removeAttribute('data-i');});}

// ══════════════════════════════════════════════════════════════
// UTILIDADES
// ══════════════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fCOP=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-CO');
const first=n=>String(n||'').trim().split(/\s+/).pop();     // "Espinosa Michael" → "Michael"
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
function showErr(id,msg){const e=$(id);e.textContent=msg;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}
function busy(id,on){const b=$(id);b.classList.toggle('load',on);b.disabled=on;}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return'hace un momento';if(m<60)return'hace '+m+' min';const h=Math.round(m/60);return h<24?'hace '+h+' h':'hace '+Math.round(h/24)+' d';}

const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}},del(k){try{localStorage.removeItem(k);}catch{}}};
let SESSION=DEMO?{codigo:'demo',nombre:'Jugador Demo',token:'demo'}:LS.get('euf_s');
let CODIGO='';

// ══════════════════════════════════════════════════════════════
// API (POST para contraseñas, reintentos, timeout)
// ══════════════════════════════════════════════════════════════
const POST_ACTIONS=['login','register','changePassword'];
const NO_RETRY=['register','changePassword'];
async function api(params,opts={}){
  const post=POST_ACTIONS.includes(params.action);
  const retries=opts.retries??(NO_RETRY.includes(params.action)?0:2);
  for(let i=0;;i++){
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),opts.timeout||25000);
    try{
      const r=post?await fetch(API,{method:'POST',body:JSON.stringify(params),signal:ctrl.signal})
                  :await fetch(API+'?'+new URLSearchParams(params),{signal:ctrl.signal});
      const txt=await r.text();
      try{return JSON.parse(txt);}catch{throw new Error('Respuesta no válida del servidor');}
    }catch(e){if(i>=retries)throw e;await new Promise(res=>setTimeout(res,1500*(i+1)));}
    finally{clearTimeout(t);}
  }
}
const NET_ERR='No pudimos conectar. Revisa tu señal e intenta de nuevo.';

// ══════════════════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════════════════
function step(s){document.querySelectorAll('.step').forEach(e=>e.classList.toggle('on',e.id==='st-'+s));const f=document.querySelector('#st-'+s+' .inp');if(f)setTimeout(()=>f.focus(),50);}
async function checkCodigo(){
  const cod=$('inp-codigo').value.trim();
  if(!cod)return showErr('err-codigo','Ingresa tu número de camiseta');
  busy('b-codigo',true);
  try{
    const r=await api({action:'isFirstTime',codigo:cod});
    if(!r.ok)showErr('err-codigo',r.error);
    else{CODIGO=cod;document.querySelectorAll('.who').forEach(e=>e.textContent=first(r.nombre));step(r.firstTime?'register':'login');}
  }catch{showErr('err-codigo',NET_ERR);}
  busy('b-codigo',false);
}
async function doRegister(){
  const p=$('inp-reg-pass').value.trim(),c=$('inp-reg-confirm').value.trim();
  if(!p||!c)return showErr('err-register','Completa ambos campos');
  if(p!==c)return showErr('err-register','Las contraseñas no coinciden');
  if(p.length<6)return showErr('err-register','Mínimo 6 caracteres');
  busy('b-register',true);
  try{const r=await api({action:'register',codigo:CODIGO,password:p});r.ok?enter(r):showErr('err-register',r.error);}
  catch{showErr('err-register',NET_ERR);}
  busy('b-register',false);
}
async function doLogin(){
  const p=$('inp-login-pass').value.trim();
  if(!p)return showErr('err-login','Ingresa tu contraseña');
  busy('b-login',true);
  try{const r=await api({action:'login',codigo:CODIGO,password:p});r.ok?enter(r):showErr('err-login',r.error);}
  catch{showErr('err-login',NET_ERR);}
  busy('b-login',false);
}
function enter(r){SESSION={codigo:r.codigo||CODIGO,nombre:r.nombre,token:r.token};LS.set('euf_s',SESSION);openApp();}
function logout(msg){
  if(SESSION)LS.del('euf_d_'+SESSION.codigo);
  LS.del('euf_s');SESSION=null;CODIGO='';
  document.body.classList.remove('in');
  document.querySelectorAll('.inp').forEach(i=>i.value='');
  step('codigo');if(msg)showErr('err-codigo',msg);
}
async function doChangePwd(){
  const o=$('pwd-old').value.trim(),n=$('pwd-new').value.trim(),c=$('pwd-confirm').value.trim();
  if(!o||!n||!c)return showErr('err-pwd','Completa todos los campos');
  if(n!==c)return showErr('err-pwd','Las contraseñas no coinciden');
  if(n.length<6)return showErr('err-pwd','Mínimo 6 caracteres');
  if(DEMO){closeSheet($('sh-pwd'));return toast('Modo demo: no se cambió nada');}
  busy('b-pwd',true);
  try{const r=await api({action:'changePassword',codigo:SESSION.codigo,oldPass:o,newPass:n});
    if(r.ok){closeSheet($('sh-pwd'));toast('Contraseña actualizada');['pwd-old','pwd-new','pwd-confirm'].forEach(i=>$(i).value='');}
    else showErr('err-pwd',r.error);}
  catch{showErr('err-pwd',NET_ERR);}
  busy('b-pwd',false);
}

// ══════════════════════════════════════════════════════════════
// DATOS
// Pendiente = ítem en 0 → se cobra el valor del PRESUPUESTO.
// Abono parcial = pagó menos que el costo → se muestra "de $X".
// ══════════════════════════════════════════════════════════════
let DATA=null;
function model(r){
  const p=r.player||{},pres=r.presupuesto||{};
  const cost={};(pres.items||[]).forEach(i=>cost[(i.cat+'|'+i.nombre).toLowerCase()]=i.costo);
  const cats=[];let items=[];
  Object.entries(p.pagos||{}).forEach(([cat,arr])=>{
    const list=arr.map(it=>{
      const costo=cost[(cat+'|'+it.item).toLowerCase()]||0;
      const st=it.valor==='GIFT'?'gift':(it.valor>0?'paid':'due');
      return{cat,item:it.item,valor:it.valor,costo,st,parcial:st==='paid'&&costo>0&&it.valor<costo};
    });
    cats.push({cat,list,done:list.filter(i=>i.st!=='due').length});
    items=items.concat(list);
  });
  cats.sort((a,b)=>isHist(a.cat)-isHist(b.cat));
  const due=items.filter(i=>i.st==='due');
  const done=items.length-due.length;
  return{
    nombre:p.nombre||r.nombre||SESSION?.nombre||'',statsName:r.statsName||'',estado:p.estado||'',mora:/mora/i.test(p.estado||''),
    total:p.total||0,sanciones:p.sanciones||0,items,cats,due,
    falta:due.reduce((s,i)=>s+i.costo,0)+(p.sanciones||0),
    pct:items.length?Math.round(done/items.length*100):100,done,
    pres:pres.items||[],presTotal:(pres.items||[]).filter(i=>!isHist(i.cat)).reduce((s,i)=>s+i.costo,0),
  };
}

async function openApp(){
  document.body.classList.add('in');
  $('avatar').textContent=initials(SESSION.nombre);
  route();
  const cached=LS.get('euf_d_'+SESSION.codigo);
  if(cached){DATA=model(cached.r);DATA.ts=cached.ts;renderAll();}else renderSkeleton();
  await refresh(!cached);
}
async function refresh(loud){
  const st=document.querySelector('.stamp');if(st)st.classList.add('busy');
  try{
    const r=DEMO?demoData():await api({action:'getPortal',token:SESSION.token});
    if(!r.ok&&r.auth===false)return logout(r.error);
    if(!r.ok)throw new Error(r.error);
    LS.set('euf_d_'+SESSION.codigo,{r,ts:Date.now()});
    DATA=model(r);DATA.ts=Date.now();renderAll();
    if(ST.ready)rerenderStats();
  }catch(e){
    if(DATA){toast('Sin conexión. Mostrando tus últimos datos.');renderAll();}
    else $('v-inicio').innerHTML=`<div class="card empty" style="margin-top:20px">${esc(NET_ERR)}<br><br><button class="btn" onclick="refresh(true)">Reintentar</button></div>`;
  }
}

// ══════════════════════════════════════════════════════════════
// NAVEGACIÓN (#inicio, #pagos, #equipo, #mas)
// ══════════════════════════════════════════════════════════════
const VIEWS=['inicio','mis','equipo','mas','pagos'];
function go(v){if(location.hash!=='#'+v)location.hash=v;else route();window.scrollTo({top:0,behavior:'smooth'});}
function route(){
  const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'inicio';
  VIEWS.forEach(x=>$('v-'+x).classList.toggle('on',x===v));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='pagos'?'inicio':v)));
  if(document.body.classList.contains('in')){if(v==='mis')renderMis();if(v==='equipo')renderTeam();}
}
addEventListener('hashchange',route);

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
function renderSkeleton(){
  $('v-inicio').innerHTML='<div class="sk" style="height:210px;border-radius:24px"></div><div class="sk" style="height:172px;margin-top:14px"></div><div class="sk" style="height:84px;margin-top:26px"></div><div class="grid" style="margin-top:12px"><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div></div>';
  $('v-pagos').innerHTML='<div class="sk" style="height:46px;margin-top:4px"></div><div class="sk" style="height:220px;margin-top:14px"></div>';
  renderMas();
}
function renderAll(){renderInicio();renderPagos();renderMas();}

function itemRow(i){
  const amt=i.st==='gift'?'Exonerado':(i.st==='due'?fCOP(i.costo):fCOP(i.valor));
  const sub=i.st==='due'?'Pendiente':(i.st==='gift'?'Sin costo para ti':(i.parcial?'Abono · de '+fCOP(i.costo):'Pagado'));
  const mark=i.st==='paid'?'✓':(i.st==='gift'?'★':'!');
  return `<div class="row"><div class="dot ${i.st}">${mark}</div><div class="nm"><b>${esc(i.item)}</b><small>${sub}</small></div><div class="amt ${i.st}">${amt}</div></div>`;
}

function renderInicio(){
  const d=DATA,C=2*Math.PI*52;
  const fecha=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
  const pend=d.due.slice(0,4);
  $('v-inicio').innerHTML=`
    <div class="hero photo">
      <div class="date">${esc(fecha)}</div>
      <h1>Hola,<br>${esc(first(d.nombre))}</h1>
      <span class="pill ${d.mora?'bad':'ok'}">${d.mora?'En mora':'Al día'}</span>
    </div>
    <div class="card ring-card">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="val" id="ring-val" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="ctr"><div class="pct">${d.pct}%</div><div class="lbl">al día</div></div>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="cap">Total pagado</div><div class="v">${fCOP(d.total)}</div><div class="s">${d.done} de ${d.items.length} ítems cubiertos</div></div>
        <div class="kpi"><div class="cap">Te falta</div><div class="v ${d.falta>0?'due':''}">${fCOP(d.falta)}</div><div class="s">${d.due.length?d.due.length+' pendiente'+(d.due.length>1?'s':''):'Nada pendiente'}</div></div>
      </div>
      <button class="detail" onclick="go('pagos')">Ver detalle de pagos y presupuesto ${ic('chev')}</button>
    </div>
    ${d.sanciones>0?`<div class="card sancion">${ic('alert')}<div style="flex:1"><div class="cap">Sanción económica</div><small style="color:var(--muted)">Incluida en lo que te falta</small></div><b>${fCOP(d.sanciones)}</b></div>`:''}
    <div class="sec">
      <div class="sec-h"><span class="cap">Pendientes</span>${d.due.length>4?`<button onclick="setFilter('due');go('pagos')">Ver todos</button>`:''}</div>
      ${pend.length?`<div class="card rows">${pend.map(itemRow).join('')}</div>`
        :`<div class="card allok"><div class="em">🙌</div><b>Estás al día</b><p>Gracias por cumplir con el equipo.</p></div>`}
    </div>
    <div class="sec">
      <div class="sec-h"><span class="cap">Accesos rápidos</span></div>
      <div class="grid">
        <a class="tile main" href="${LINKS.bienestar}"><div class="ic">${ic('pulse')}</div><div><b>Registrar bienestar</b><small>Después de cada entreno · 1 minuto</small></div><span class="go">${ic('chev')}</span></a>
        <button class="tile" style="text-align:left" onclick="go('mis')"><div class="ic">${ic('user')}</div><div><b>Mis stats</b><small>Tu temporada y tu lugar en el equipo</small></div></button>
        <a class="tile" href="${LINKS.subirEvidencias}" target="_blank" rel="noopener"><div class="ic">${ic('upload')}</div><div><b>Subir evidencias</b><small>3 de gimnasio y 1 de lanzamiento</small></div></a>
      </div>
    </div>
    <div class="stamp">Actualizado ${ago(d.ts||Date.now())}<button aria-label="Actualizar" onclick="refresh()">${ic('refresh')}</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const v=$('ring-val');if(v)v.style.strokeDashoffset=C*(1-d.pct/100);}));
}

let FILTER='all',PAGOS_TAB='mis';
function setPagosTab(t){PAGOS_TAB=t;if(DATA)renderPagos();}
function setFilter(f){FILTER=f;if(DATA)renderPagos();}
function renderPagos(){
  const d=DATA;
  const F=[['all','Todos'],['due','Pendientes'],['paid','Pagados'],['gift','Exonerados']];
  const cats=d.cats.map(c=>({...c,show:FILTER==='all'?c.list:c.list.filter(i=>i.st===FILTER)})).filter(c=>c.show.length);
  const head=`<div class="sub-h"><button class="back" aria-label="Volver" onclick="go('inicio')">${ic('back')}</button><h2>Pagos</h2></div>
    <div class="seg2"><button class="${PAGOS_TAB==='mis'?'on':''}" onclick="setPagosTab('mis')">Mis pagos</button><button class="${PAGOS_TAB==='pres'?'on':''}" onclick="setPagosTab('pres')">Presupuesto</button></div>`;
  if(PAGOS_TAB==='pres'){$('v-pagos').innerHTML=head+presHTML();animateBars('v-pagos');return;}
  $('v-pagos').innerHTML=head+`
    <div class="chips" style="margin-top:12px">${F.map(([k,l])=>`<button class="chip ${FILTER===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}</div>
    ${cats.length?cats.map(c=>{const p=Math.round(c.done/c.list.length*100);return`
      <div class="card cat">
        <div class="cat-h"><div class="cat-t"><b>${esc(c.cat)}${isHist(c.cat)?' <small class="tag">Historial</small>':''}</b><span>${c.done}/${c.list.length} al día</span></div>
        <div class="bar"><i class="${p===100?'full':''}" data-w="${p}"></i></div></div>
        <div class="rows">${c.show.map(itemRow).join('')}</div>
      </div>`;}).join('')
    :`<div class="card empty" style="margin-top:14px">${FILTER==='due'?'🙌 No tienes pendientes':'No hay ítems en este filtro'}</div>`}`;
  animateBars('v-pagos');
}

function presHTML(){
  const d=DATA,groups={};
  [...d.pres].sort((a,b)=>isHist(a.cat)-isHist(b.cat)).forEach(i=>(groups[i.cat]=groups[i.cat]||[]).push(i));
  const max=Math.max(1,...Object.entries(groups).filter(([c])=>!isHist(c)).map(([,g])=>g.reduce((s,i)=>s+i.costo,0)));
  return `
    <div class="card big" style="margin-top:12px"><div class="cap">Presupuesto por jugador · temporada</div><div class="v">${fCOP(d.presTotal)}</div><div class="s">${d.pres.filter(i=>!isHist(i.cat)).length} ítems · el historial no suma aquí</div></div>
    ${Object.entries(groups).map(([cat,list])=>{const sub=list.reduce((s,i)=>s+i.costo,0);return`
      <details class="card cat">
        <summary class="cat-h"><div class="cat-t"><b>${esc(cat)}${isHist(cat)?' <small class="tag">Historial</small>':''}</b><span style="display:flex;align-items:center;gap:6px">${fCOP(sub)}${ic('chev','i chev')}</span></div>
        <div class="bar"><i data-w="${Math.min(100,Math.round(sub/max*100))}"></i></div></summary>
        <div class="rows">${list.map(i=>`<div class="row"><div class="nm"><b>${esc(i.nombre)}</b></div><div class="amt">${fCOP(i.costo)}</div></div>`).join('')}</div>
      </details>`;}).join('')}`;
}

function renderMas(){
  const n=SESSION?.nombre||'';

  $('v-mas').innerHTML=`
    <div class="card me"><div class="avatar">${esc(initials(n))}</div><div><b>${esc(n)}</b><small>Camiseta ${esc(SESSION?.codigo||'')} · Temporada 2026</small></div></div>
    <div class="sec"><div class="sec-h"><span class="cap">Herramientas</span></div>
      <div class="card menu">
        ${item(LINKS.bienestar,'pulse','Control de bienestar','Sueño, fatiga, ánimo y esfuerzo')}
        ${item(LINKS.subirEvidencias,'upload','Subir evidencias físicas','Gimnasio y lanzamiento',1)}
        ${item(LINKS.verEvidencias,'eye','Ver mis evidencias','Revisa que hayan quedado cargadas',1)}
      </div></div>
    <div class="sec"><div class="sec-h"><span class="cap">Cuenta</span></div>
      <div class="card menu">
        <button onclick="openInstall()"><span class="ic">${ic('install')}</span><span class="tx"><b>Instalar la app</b><small>Tenla en tu pantalla de inicio</small></span>${ic('chev','i chev')}</button>
        <button onclick="openSheet($('sh-pwd'))"><span class="ic">${ic('key')}</span><span class="tx"><b>Cambiar contraseña</b></span>${ic('chev','i chev')}</button>
        <button class="danger" onclick="logout()"><span class="ic">${ic('out')}</span><span class="tx"><b>Cerrar sesión</b></span></button>
      </div></div>
    <div class="ver">Euforia Ultimate · ${VERSION}</div>`;
}

function animateBars(id){requestAnimationFrame(()=>requestAnimationFrame(()=>$(id).querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%')));}

}
