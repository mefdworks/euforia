<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Euforia · Bienestar</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/euforia.css">
<style>
body{padding-bottom:110px}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + var(--safe-t)) 16px 0}
.prog{position:sticky;top:0;z-index:20;padding:10px 0 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.prog .track{height:5px;border-radius:9px;background:var(--s3);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--red2));box-shadow:0 0 10px var(--glow);transition:width .4s}
.prog small{display:block;color:var(--muted);font-size:.78rem;margin-top:7px}
.who{display:flex;align-items:center;gap:12px;padding:14px 16px}
.who .avatar{width:44px;height:44px;flex-shrink:0}
.who b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;text-transform:uppercase;line-height:1.1}
.who small{color:var(--muted);font-size:.8rem}
.dates{display:flex;gap:6px;margin-left:auto;flex-shrink:0;position:relative}
.dates button{padding:8px 12px;border-radius:99px;background:var(--s2);font-size:.82rem;font-weight:600;color:var(--muted)}
.dates button.on{background:var(--text);color:var(--bg)}
.dates input{position:absolute;right:0;bottom:0;opacity:0;pointer-events:none;width:1px;height:1px}
.q{padding:18px 16px;margin-top:12px}
.q h4{font-weight:600;font-size:1.02rem}
.q p{color:var(--muted);font-size:.8rem;margin:3px 0 0}
.q .head{margin-bottom:12px}
.q.done h4::after{content:' ✓';color:var(--ok);font-size:.85rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{height:54px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.35rem;color:var(--soft);transition:transform .12s}
.scale button:active{transform:scale(.94)}
.scale button.on{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--glow)}
.ends{display:flex;justify-content:space-between;color:var(--faint);font-size:.74rem;margin-top:8px;gap:10px}
.ends span:last-child{text-align:right}
.caption{min-height:20px;margin-top:8px;font-weight:600;font-size:.9rem;color:var(--text);text-align:center}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:50px;border-radius:10px;position:relative;overflow:hidden;background:var(--s2);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.rpe button i{position:absolute;left:0;right:0;bottom:0;opacity:.32;transition:opacity .15s}
.rpe button b{position:relative}
.rpe button.on{outline:2px solid #fff;outline-offset:1px}
.rpe button.on i{opacity:1}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border-radius:14px;padding:8px}
.step button{width:48px;height:48px;border-radius:12px;background:var(--s3);font-size:1.5rem;color:var(--soft)}
.step b{font-family:'Barlow Condensed',sans-serif;font-size:2.1rem;font-weight:800;line-height:1}
.step b small{font-size:.9rem;color:var(--muted);margin-left:4px;font-family:'Barlow',sans-serif;font-weight:500}
textarea.inp{border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:.95rem;min-height:84px;resize:vertical}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 16px calc(14px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 35%)}
.dock .btn{max-width:528px;margin:0 auto}
.dock .btn.wait{background:var(--s3);box-shadow:none;color:var(--muted)}
.note{margin-top:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;border-color:rgba(210,171,98,.35);background:linear-gradient(90deg,rgba(210,171,98,.1),var(--s1))}
.note b{display:block;font-weight:600}.note small{color:var(--muted)}
.done-top{text-align:center;padding:26px 10px 6px}
.done-top .ring{margin:0 auto;width:160px;height:160px}
.done-top .pct{font-size:3rem}
.done-top h3{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.2rem;text-transform:uppercase;margin-top:18px}
.done-top p{color:var(--muted);margin-top:6px;line-height:1.5}
.done-top p b{color:var(--text)}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.mini4 div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.mini4 b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.5rem}
.mini4 small{color:var(--muted);font-size:.7rem}
.gate{min-height:80dvh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.gate .logo{width:150px;margin:0 auto 10px}
.gate h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;text-transform:uppercase}
.gate p{color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#c0272d"/></linearGradient></defs></svg>
<div class="wrap" id="root"></div>
<div class="dock" id="dock" hidden><button class="btn wait" id="b-send" onclick="send()"><span class="sp"></span><span class="tx">Faltan respuestas</span></button></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// EUFORIA — Control de bienestar
// El jugador entra con su sesión del portal; el nombre lo pone el servidor.
// ══════════════════════════════════════════════════════════════
const API='https://script.google.com/macros/s/AKfycbwbV5XInsoGL7A_fWG767cGdltf7-h_do8VmYCkcDhU4xskeBKCQ4BkzsrVJGyv44IR/exec';
const DEMO=new URLSearchParams(location.search).has('demo');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}}};
const SESSION=DEMO?{codigo:'demo',nombre:'Jugador Demo',token:'demo'}:LS.get('euf_s');
const first=n=>String(n||'').trim().split(/\s+/).pop();
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}

async function api(params,post){
  for(let i=0;;i++){
    const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),25000);
    try{
      const r=post?await fetch(API,{method:'POST',body:JSON.stringify(params),signal:ctrl.signal})
                  :await fetch(API+'?'+new URLSearchParams(params),{signal:ctrl.signal});
      const txt=await r.text();try{return JSON.parse(txt);}catch{throw new Error('Respuesta no válida');}
    }catch(e){if(post||i>=2)throw e;await new Promise(r=>setTimeout(r,1500*(i+1)));}
    finally{clearTimeout(t);}
  }
}

// ── Preguntas (mismas escalas y etiquetas del formulario anterior) ──
const Q=[
  {k:'calidad_sueno',t:'Calidad del sueño',l:['Insomnio','Sueño inquieto','Dificultad para conciliar el sueño','Bueno','Muy descansado']},
  {k:'fatiga',t:'Fatiga',l:['Muy fatigado','Fatigado','Normal','Recuperado','Muy recuperado']},
  {k:'dano_muscular',t:'Daño muscular general',l:['Muy adolorido','Adolorido','Normal','Buenas sensaciones','Muy buenas sensaciones']},
  {k:'estres',t:'Nivel de estrés',l:['Muy estresado','Estresado','Normal','Relajado','Muy relajado']},
  {k:'animo',t:'Estado de ánimo',l:['Molesto / deprimido','Mal humor / triste','Serio','Contento','Muy positivo / contento']},
];
const RPE_L=['Muy, muy fácil','Fácil','Moderado','Algo duro','Duro','Duro','Muy duro','Muy duro','Extremo','Máximo esfuerzo'];
const RPE_C=['#3ddc84','#5fd17a','#8fcf6a','#b9c95a','#e0bf4c','#f5a742','#f4843f','#ee6340','#e5453f','#c0272d'];
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY=iso(new Date()),YEST=iso(new Date(Date.now()-864e5));
const A={fecha:TODAY,horas_sueno:7,tipo_sesion:''};
let HIST=[];

function tipoFor(f){const d=new Date(f+'T12:00:00').getDay();return d===0||d===6?'Fin de semana / Festivo':'Entre semana';}
A.tipo_sesion=tipoFor(A.fecha);
const answered=()=>Q.filter(q=>A[q.k]).length+(A.rpe?1:0);
const TOTAL=Q.length+1;
const backBtn='<a class="back" href="index.html" aria-label="Volver al portal"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>';

function render(){
  if(!SESSION?.token){
    $('root').innerHTML=`<div class="gate"><span class="logo"></span><h2>Control de bienestar</h2>
      <p>Para registrar tu bienestar entra primero al portal con tu número de camiseta.</p>
      <a class="btn" href="index.html">Ir al portal</a></div>`;
    return;
  }
  const already=HIST.some(h=>h.fecha===A.fecha);
  const dLabel=A.fecha===TODAY?'Hoy':A.fecha===YEST?'Ayer':new Date(A.fecha+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
  $('root').innerHTML=`
  <div class="sub-h">${backBtn}<h2>Bienestar</h2><span class="logo" style="width:72px"></span></div>
  <div class="prog"><div class="track"><i id="prog-i"></i></div><small id="prog-t"></small></div>
  <div class="card who"><div class="avatar">${esc(initials(SESSION.nombre))}</div><div style="min-width:0"><b>${esc(first(SESSION.nombre))}</b><small>${esc(dLabel)}</small></div>
    <div class="dates"><button class="${A.fecha===TODAY?'on':''}" onclick="setFecha('${TODAY}')">Hoy</button><button class="${A.fecha===YEST?'on':''}" onclick="setFecha('${YEST}')">Ayer</button>
    <button class="${A.fecha!==TODAY&&A.fecha!==YEST?'on':''}" aria-label="Otra fecha" onclick="otraFecha()">📅</button><input type="date" id="f-otra" max="${TODAY}" value="${A.fecha}" onchange="this.value&&setFecha(this.value)"></div></div>
  ${already?`<div class="card note"><span style="font-size:1.4rem">⚠️</span><div><b>Ya tienes un registro ese día</b><small>Si lo envías otra vez quedará duplicado.</small></div></div>`:''}
  <div class="card q"><div class="head"><h4>Tipo de sesión</h4></div>
    <div class="seg2" style="margin:0">${['Entre semana','Fin de semana / Festivo'].map(v=>`<button class="${A.tipo_sesion===v?'on':''}" onclick="A.tipo_sesion='${v}';keep(render)">${v==='Entre semana'?'Entre semana':'Fin de semana'}</button>`).join('')}</div></div>
  <div class="card q done"><div class="head"><h4>¿Cuántas horas dormiste?</h4><p>La noche anterior</p></div>
    <div class="step"><button onclick="sleep(-.5)" aria-label="Menos">−</button><b>${String(A.horas_sueno).replace('.',',')}<small>horas</small></b><button onclick="sleep(.5)" aria-label="Más">+</button></div></div>
  ${Q.map(q=>`<div class="card q ${A[q.k]?'done':''}"><div class="head"><h4>${q.t}</h4></div>
    <div class="scale">${[1,2,3,4,5].map(v=>`<button class="${A[q.k]==v?'on':''}" onclick="pick('${q.k}',${v})">${v}</button>`).join('')}</div>
    ${A[q.k]?`<div class="caption">${q.l[A[q.k]-1]}</div>`:`<div class="ends"><span>${q.l[0]}</span><span>${q.l[4]}</span></div>`}</div>`).join('')}
  <div class="card q ${A.rpe?'done':''}"><div class="head"><h4>¿Qué tan duro fue el entreno? (RPE)</h4><p>1 muy suave · 10 al límite</p></div>
    <div class="rpe">${RPE_C.map((c,i)=>`<button class="${A.rpe==i+1?'on':''}" onclick="pick('rpe',${i+1})"><i style="height:${28+i*7}%;background:${c}"></i><b>${i+1}</b></button>`).join('')}</div>
    ${A.rpe?`<div class="caption">${RPE_L[A.rpe-1]}</div>`:''}</div>
  <div class="card q"><div class="head"><h4>Comentarios <span style="color:var(--muted);font-weight:500">(opcional)</span></h4><p>Molestias específicas o algo que quieras contarnos</p></div>
    <textarea class="inp" id="coment" placeholder="Ej. dolor leve en rodilla derecha desde el sábado…" oninput="A.comentarios=this.value">${esc(A.comentarios||'')}</textarea></div>`;
  $('dock').hidden=false;
  progress();
}
const keep=fn=>{const y=scrollY;fn();scrollTo(0,y);};
function progress(){
  const a=answered(),left=TOTAL-a;
  $('prog-i').style.width=(a/TOTAL*100)+'%';
  $('prog-t').textContent=left?`${a} de ${TOTAL} · te ${left===1?'falta 1':'faltan '+left}`:'¡Listo para enviar!';
  const b=$('b-send');b.classList.toggle('wait',!!left);b.querySelector('.tx').textContent=left?(left===1?'Falta 1 respuesta':`Faltan ${left} respuestas`):'Enviar registro';
}
function pick(k,v){A[k]=v;keep(render);}
function sleep(d){A.horas_sueno=Math.min(14,Math.max(0,Math.round((A.horas_sueno+d)*2)/2));keep(render);}
function setFecha(f){A.fecha=f;A.tipo_sesion=tipoFor(f);keep(render);}
function otraFecha(){const i=$('f-otra');try{i.showPicker();}catch{i.click();}}

async function send(){
  const left=TOTAL-answered();
  if(left){const q=[...document.querySelectorAll('.q')].find(x=>!x.classList.contains('done')&&x.querySelector('.scale,.rpe'));
    if(q)q.scrollIntoView({behavior:'smooth',block:'center'});toast(left===1?'Falta 1 respuesta':`Faltan ${left} respuestas`);return;}
  const b=$('b-send');b.classList.add('load');b.disabled=true;
  const payload={action:'submitBienestar',token:SESSION.token,nombre:SESSION.nombre,fecha:A.fecha,tipo_sesion:A.tipo_sesion,horas_sueno:A.horas_sueno,
    calidad_sueno:A.calidad_sueno,fatiga:A.fatiga,dano_muscular:A.dano_muscular,estres:A.estres,animo:A.animo,rpe:A.rpe,comentarios:A.comentarios||''};
  try{
    const r=DEMO?demoSend(payload):await api(payload,true);
    if(!r.ok&&r.auth===false){localStorage.removeItem('euf_s');location.href='index.html';return;}
    if(!r.ok)throw new Error(r.error);
    done(r);
  }catch(e){toast('No se pudo enviar. Revisa tu señal e intenta de nuevo.');b.classList.remove('load');b.disabled=false;}
}

function done(r){
  $('dock').hidden=true;scrollTo(0,0);
  const h=r.hist&&r.hist.length?r.hist:[{fecha:A.fecha,indice:r.indice}];
  const prev=h.slice(0,-1).slice(-7),avg=prev.length?prev.reduce((s,x)=>s+x.indice,0)/prev.length:null;
  const diff=avg==null?null:Math.round((r.indice-avg)*10)/10;
  const mes=h.filter(x=>x.fecha.slice(0,7)===A.fecha.slice(0,7)).length;
  const last=h.slice(-7),C=326.7,dec=v=>String(v).replace('.',',');
  const msg=diff==null?'Es tu primer registro. ¡Bien hecho!'
    :Math.abs(diff)<.5?`Estás en tu promedio reciente (<b>${dec(avg.toFixed(1))}</b>).`
    :diff>0?`<b>${dec(diff)} puntos arriba</b> de tu promedio reciente.`
    :`<b>${dec(Math.abs(diff))} puntos abajo</b> de tu promedio reciente. Cuídate y descansa.`;
  $('root').innerHTML=`
  <div class="sub-h">${backBtn}<h2>Bienestar</h2><span class="logo" style="width:72px"></span></div>
  <div class="done-top">
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="val" id="rv" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
      <div class="ctr"><div class="pct">${r.indice}</div><div class="lbl">de 20</div></div></div>
    <h3>¡Registro guardado!</h3><p>Tu índice de bienestar es <b>${r.indice}/20</b>.<br>${msg}</p></div>
  <div class="mini4"><div><b>${A.fatiga}</b><small>Fatiga</small></div><div><b>${A.dano_muscular}</b><small>Músculo</small></div><div><b>${A.estres}</b><small>Estrés</small></div><div><b>${A.animo}</b><small>Ánimo</small></div></div>
  <div class="card streak" style="margin-top:14px"><span class="em">🔥</span><div><b>${mes} registro${mes===1?'':'s'} este mes</b><small>Cada registro ayuda al cuerpo técnico a cuidar tu carga.</small></div></div>
  ${last.length>1?`<div class="sec"><div class="sec-h"><span class="cap">Tus últimos ${last.length} registros</span></div><div class="card chart" id="spark"></div></div>`:''}
  <a class="btn" href="index.html" style="margin-top:20px">Volver al portal</a>`;
  if(last.length>1)$('spark').innerHTML=spark(last);
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('rv').style.strokeDashoffset=C*(1-r.indice/20)));
}
function spark(v){
  const W=320,H=120,p=18,n=v.length,x=i=>p+i*(W-2*p)/(n-1),y=a=>H-22-(a-4)/16*(H-36);
  const d=v.map((a,i)=>(i?'L':'M')+x(i)+' '+y(a.indice)).join(' ');
  const lab=f=>new Date(f+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'}).replace(' de ',' ').replace('.','');
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Barlow"><defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5383e" stop-opacity=".35"/><stop offset="1" stop-color="#e5383e" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${x(n-1)} ${H-22} L${x(0)} ${H-22}Z" fill="url(#fa)"/><path d="${d}" fill="none" stroke="#e5383e" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(229,56,62,.6))"/>
    ${v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a.indice)}" r="${i===n-1?5:3}" fill="${i===n-1?'#fff':'#e5383e'}"/><text x="${x(i)}" y="${y(a.indice)-9}" fill="rgba(255,255,255,.6)" font-size="9" text-anchor="middle">${a.indice}</text><text x="${x(i)}" y="${H-5}" fill="rgba(255,255,255,.4)" font-size="8.5" text-anchor="middle">${i===n-1?'Hoy':lab(a.fecha)}</text>`).join('')}</svg>`;
}

// ── Demo (bienestar.html?demo): no guarda nada ──
function demoSend(p){
  const idx=+p.fatiga + +p.dano_muscular + +p.estres + +p.animo;
  const base=[12,13,11,14,13,15].map((v,i)=>({fecha:iso(new Date(Date.now()-(12-i*2)*864e5)),indice:v}));
  return{ok:true,indice:idx,hist:[...base,{fecha:p.fecha,indice:idx}]};
}

render();
if(SESSION?.token&&!DEMO)api({action:'getMiBienestar',token:SESSION.token}).then(r=>{
  if(r.ok){HIST=r.hist||[];if(!document.querySelector('.done-top'))keep(render);}
  else if(r.auth===false){localStorage.removeItem('euf_s');location.href='index.html';}
}).catch(()=>{});
</script>
</body>
</html>
